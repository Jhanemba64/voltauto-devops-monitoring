name: devops-monitoring
services:
  backend:
    build:
      args:
      - NODE_ENV=development
      context: backend
      target: development
    command: npm run start-watch
    environment:
      - DATABASE_DB=example
      - DATABASE_USER=root
      - DATABASE_PASSWORD=/run/secrets/db-password
      - DATABASE_HOST=db
      - NODE_ENV=development
    ports:
      - 80:80
      - 9229:9229
      - 9230:9230
    secrets:
      - db-password
    volumes:
      - ./backend/src:/code/src:ro
      - ./backend/package.json:/code/package.json
      - ./backend/package-lock.json:/code/package-lock.json
      - back-notused:/opt/app/node_modules
    networks:
      - public
      - private
    depends_on:
      - db
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command: '--default-authentication-plugin=mysql_native_password'
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - private
    environment:
      - MYSQL_DATABASE=example
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
  frontend:
    build:
      context: frontend
      target: development
    ports:
      - 3000:3000
    volumes:
      - ./frontend/src:/code/src
      - /code/node_modules
    networks:
      - public
    depends_on:
      - backend

  # --- Supervision Zabbix ---
  zabbix-db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --log-bin-trust-function-creators=1
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZBX_DB_PASSWORD:?copier .env.example en .env}
      - MYSQL_ROOT_PASSWORD=${ZBX_DB_ROOT_PASSWORD:?copier .env.example en .env}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - monitoring
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      retries: 12
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0.32
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZBX_DB_PASSWORD}
    ports:
      - 10051:10051
    networks:
      - monitoring
    depends_on:
      zabbix-db:
        condition: service_healthy
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0.32
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${ZBX_DB_PASSWORD}
      - PHP_TZ=Europe/Paris
    ports:
      - 8080:8080
    networks:
      - monitoring
    depends_on:
      - zabbix-server
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0.32
    restart: unless-stopped
    # root + socket Docker : nécessaires au plugin Docker de l'agent 2
    user: root
    pid: host
    environment:
      - ZBX_HOSTNAME=Zabbix server
      - ZBX_SERVER_HOST=zabbix-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
  # Tâche ponctuelle : rattache l'agent et le template Docker au host « Zabbix server »
  zabbix-init:
    image: alpine:3.22
    command: sh -c "apk add --no-cache -q curl jq && sh /init.sh"
    environment:
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME}
    volumes:
      - ./zabbix/init.sh:/init.sh:ro
    networks:
      - monitoring
    depends_on:
      - zabbix-web

networks:
  public:
  private:
  monitoring:
volumes:
  back-notused:
  db-data:
  zabbix-db-data:
secrets:
  db-password:
    file: db/password.txt
