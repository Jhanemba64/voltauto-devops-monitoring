# Mises à jour proposées chaque mois, regroupées par écosystème.
# Les correctifs de sécurité sont proposés dès leur publication (alertes Dependabot).
# Les PR visent dev, puis suivent la promotion dev → preprod → main.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Images de la stack (Zabbix, Elastic, Grafana…) et images de base des Dockerfiles
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # Correctifs uniquement : versions LTS figées (Zabbix 7.0, MySQL 8.4, Elastic 8.19, nginx stable)
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # Correctifs uniquement : Node.js 24 LTS et branche stable de nginx
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
